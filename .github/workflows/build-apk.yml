name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.CANDLEALERT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CANDLEALERT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CANDLEALERT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets."
            echo "Add CANDLEALERT_KEYSTORE_B64, CANDLEALERT_STORE_PASSWORD and CANDLEALERT_KEY_PASSWORD to repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/candlealert-release.keystore"
          echo "CANDLEALERT_KEYSTORE_PATH=$RUNNER_TEMP/candlealert-release.keystore" >> "$GITHUB_ENV"
          echo "CANDLEALERT_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CANDLEALERT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace -PVERSION_CODE=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandleAlert-release-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
